# fly.toml app configuration file generated for goi-bot on 2026-08-02T17:40:29Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'goi-bot'
primary_region = 'ams'

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"
  DB_SYNCHRONIZE = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
