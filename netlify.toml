# Netlify builds the TanStack Start frontend from this monorepo.
# NITRO_PRESET=netlify emits SSR into `.netlify/functions-internal` and
# static assets into `goi-bot-frontend/dist`.

[build]
  base = "."
  command = "npm install && npm run build --workspace=goi-bot-frontend --if-present"
  publish = "goi-bot-frontend/dist"

[build.environment]
  NODE_VERSION = "22"
  # Netlify build containers are memory-limited; 8GB heap OOMs the build.
  NODE_OPTIONS = "--max-old-space-size=4096"
  NITRO_PRESET = "netlify"
  VITE_API_URL = "https://goi-bot.fly.dev"
  API_URL = "https://goi-bot.fly.dev"
