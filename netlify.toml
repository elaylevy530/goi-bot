# TanStack Start + Nitro on Netlify (SSR via functions-internal).
# base must be the frontend package so `.netlify/functions-internal` is discovered.

[build]
  base = "goi-bot-frontend"
  command = "cd .. && npm install && npm run build --workspace=goi-bot-frontend"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NODE_OPTIONS = "--max-old-space-size=4096"
  NITRO_PRESET = "netlify"
  VITE_API_URL = "https://goi-bot.fly.dev"
  API_URL = "https://goi-bot.fly.dev"

# Fallback SSR routing if Nitro leaves `_redirects` empty outside Netlify CI.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false
