<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Goi — אופליין</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#35AD29" />
    <style>
      html, body { margin: 0; height: 100%; background: #fff; color: #0a0a0a; font-family: Heebo, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
      .card { max-width: 380px; text-align: center; }
      .logo { width: 96px; height: 96px; border-radius: 24px; margin: 0 auto 20px; display: block; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #525252; margin: 0 0 24px; }
      button { background: #35AD29; color: #fff; border: 0; padding: 14px 28px; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <img class="logo" src="/pwa-192.png" alt="Goi" />
        <h1>אין כרגע חיבור לאינטרנט</h1>
        <p>בדקו את החיבור ונסו שוב</p>
        <button onclick="location.reload()">נסה שוב</button>
      </div>
    </div>
  </body>
</html>
