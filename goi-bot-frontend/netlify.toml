# Used when Netlify base directory is `goi-bot-frontend`.

[build]
  command = "cd .. && npm install && npm run build --workspace=goi-bot-frontend"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NODE_OPTIONS = "--max-old-space-size=4096"
  NITRO_PRESET = "netlify"
  VITE_API_URL = "https://goi-bot.fly.dev"
  API_URL = "https://goi-bot.fly.dev"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false
