# Used when Netlify base directory is `goi-bot-frontend`.

[build]
  # Clean install on Linux so optional native binaries (esbuild/lightningcss/oxide)
  # resolve for this platform. Keep package-lock.json; only wipe node_modules.
  command = "cd .. && rm -rf node_modules goi-bot-frontend/node_modules goi-bot-backend/node_modules && npm install --include=optional && npm run build --workspace=goi-bot-frontend"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NODE_OPTIONS = "--max-old-space-size=4096"
  NITRO_PRESET = "netlify"
  # Ensure optional platform packages (esbuild/rollup binaries) are not omitted.
  NPM_CONFIG_OPTIONAL = "true"
  VITE_API_URL = "https://goi-bot.fly.dev"
  API_URL = "https://goi-bot.fly.dev"
  PAYPAL_MODE = "live"
  # Browser Maps key is public-by-design (HTTP-referrer restricted) and Vite inlines
  # VITE_* into the Nitro SSR bundle. Pro smart-scan flags the AIza… pattern otherwise.
  # Marked-secret env vars are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY,GOOGLE_MAPS_API_KEY,GOOGLE_MAPS_BROWSER_KEY"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Content-Type = "application/json; charset=utf-8"
